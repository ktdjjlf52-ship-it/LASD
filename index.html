<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b}
body{display:grid;place-items:center;font-family:Arial,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#07152b 0%,#02040b 48%,#000 100%)}
.a{position:absolute;color:#54baff;font-weight:700;line-height:1;
 text-shadow:0 0 5px #168cff,0 0 12px #168cff,0 0 24px #087cff,0 0 42px #005bff;
 animation:twinkle var(--dur) ease-in-out infinite alternate;
 opacity:var(--op);transform:translate(-50%,-50%) scale(var(--scale))}
@keyframes twinkle{0%{opacity:.25;filter:blur(.6px)}100%{opacity:1;filter:blur(0);text-shadow:0 0 8px #5ccaff,0 0 18px #168cff,0 0 38px #006dff}}
#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
 color:#9bdcff;font-size:clamp(26px,7vw,54px);font-weight:800;
 text-shadow:0 0 8px #168cff,0 0 24px #087cff,0 0 55px #005bff;
 animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.94);opacity:.75}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
</style>
</head>
<body>
<div id="stage"><div id="center">A</div></div>
<script>
const stage=document.getElementById('stage');
const points=[];
/* Heart outline and filled interior, built from glowing A characters. */
for(let y=-1.25;y<=1.25;y+=.115){
 for(let x=-1.45;x<=1.45;x+=.105){
  const X=x, Y=-y;
  const q=Math.pow(X*X+Y*Y-1,3)-X*X*Y*Y*Y;
  if(q<=0){
   const el=document.createElement('span');
   el.className='a';el.textContent='A';
   const jitter=(Math.random()-.5)*1.4;
   el.style.left=(50+x*17.2+jitter)+'%';
   el.style.top=(47+y*24+(Math.random()-.5)*1.2)+'%';
   el.style.fontSize=(10+Math.random()*10)+'px';
   el.style.setProperty('--op',(.45+Math.random()*.55).toFixed(2));
   el.style.setProperty('--scale',(.75+Math.random()*.7).toFixed(2));
   el.style.setProperty('--dur',(1+Math.random()*2.8).toFixed(2)+'s');
   el.style.animationDelay=(-Math.random()*3)+'s';
   stage.appendChild(el);
  }
 }
}
</script>
</body>
</html>
